<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-ml" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a16" />
      <stop offset="100%" stop-color="#0c1024" />
    </linearGradient>
    <linearGradient id="line-grad-ml" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="area-grad-ml" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25" />
      <stop offset="80%" stop-color="#00f0ff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>
    <filter id="glow-cyan-ml" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-strong-ml" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="2" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .panel-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; font-size: 11px; font-weight: 700; fill: #00f0ff; letter-spacing: 1.5px; }
    .panel-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; font-size: 10px; fill: #94a3b8; letter-spacing: 1px; }
    .axis-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; font-size: 9px; font-weight: 600; fill: #64748b; letter-spacing: 0.5px; }
    .tag-pill { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; font-size: 9px; fill: #10b981; font-weight: 600; letter-spacing: 0.5px; }

    .curve-path {
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: drawCurve 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes drawCurve {
      0% { stroke-dashoffset: 600; opacity: 0.3; }
      15% { opacity: 1; }
      80% { stroke-dashoffset: 0; opacity: 1; }
      92% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0.3; }
    }

    .area-fill {
      animation: fadeArea 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes fadeArea {
      0% { opacity: 0; }
      30% { opacity: 0.35; }
      80% { opacity: 0.75; }
      92% { opacity: 0.75; }
      100% { opacity: 0; }
    }

    .threshold-line {
      animation: pulseLine 2s ease-in-out infinite alternate;
    }
    @keyframes pulseLine {
      from { opacity: 0.25; }
      to { opacity: 0.75; }
    }

    .status-dot {
      animation: pulseDot 1.5s ease-in-out infinite alternate;
    }
    @keyframes pulseDot {
      from { fill: #00f0ff; opacity: 0.5; }
      to { fill: #10b981; opacity: 1; }
    }
  </style>

  <!-- Card Background -->
  <rect width="540" height="280" rx="14" fill="url(#bg-grad-ml)" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.3" />

  <!-- Technical Corner Brackets -->
  <g stroke="#00f0ff" stroke-width="1.8" fill="none" opacity="0.75">
    <path d="M 12 24 L 12 12 L 24 12" />
    <path d="M 528 24 L 528 12 L 516 12" />
    <path d="M 12 256 L 12 268 L 24 268" />
    <path d="M 528 256 L 528 268 L 516 268" />
  </g>

  <!-- Header Bar -->
  <g transform="translate(24, 22)">
    <circle cx="0" cy="5" r="3.5" fill="#ef4444" opacity="0.8" />
    <circle cx="10" cy="5" r="3.5" fill="#f59e0b" opacity="0.8" />
    <circle cx="20" cy="5" r="3.5" fill="#10b981" opacity="0.8" />

    <text x="32" y="9" class="panel-title">TRAINING VISUALIZATION</text>
    <text x="206" y="9" class="panel-sub">// LOSS CONVERGENCE</text>

    <rect x="360" y="-3" width="130" height="18" rx="9" fill="#091428" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.6" />
    <circle cx="372" cy="6" r="3.5" class="status-dot" />
    <text x="382" y="9" class="tag-pill">OPTIMIZING CYCLE</text>
  </g>

  <!-- Grid Lines -->
  <g stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.7">
    <line x1="70" y1="70" x2="490" y2="70" />
    <line x1="70" y1="110" x2="490" y2="110" />
    <line x1="70" y1="150" x2="490" y2="150" />
    <line x1="70" y1="190" x2="490" y2="190" />
    <line x1="70" y1="230" x2="490" y2="230" />

    <line x1="70" y1="70" x2="70" y2="230" />
    <line x1="175" y1="70" x2="175" y2="230" />
    <line x1="280" y1="70" x2="280" y2="230" />
    <line x1="385" y1="70" x2="385" y2="230" />
    <line x1="490" y1="70" x2="490" y2="230" />
  </g>

  <!-- Axis Lines -->
  <g stroke="#334155" stroke-width="1.5">
    <line x1="70" y1="230" x2="500" y2="230" />
    <line x1="70" y1="60" x2="70" y2="230" />
  </g>

  <!-- Axis Labels (Conceptual Only) -->
  <text x="45" y="75" class="axis-label" text-anchor="end">HIGH</text>
  <text x="45" y="150" class="axis-label" text-anchor="end">MID</text>
  <text x="45" y="228" class="axis-label" text-anchor="end">CONV</text>

  <text x="24" y="145" class="axis-label" transform="rotate(-90 24 145)" text-anchor="middle" fill="#00f0ff">LOSS</text>

  <text x="70" y="248" class="axis-label">EPOCH 0</text>
  <text x="280" y="248" class="axis-label" text-anchor="middle">TRAINING PHASE</text>
  <text x="490" y="248" class="axis-label" text-anchor="end">CONVERGENCE</text>

  <!-- Target Convergence Line -->
  <line x1="70" y1="210" x2="490" y2="210" stroke="#10b981" stroke-width="1" stroke-dasharray="4,4" class="threshold-line" />
  <text x="495" y="213" font-family="monospace" font-size="8" fill="#10b981" opacity="0.8">TARGET</text>

  <!-- The Actual Loss Curve -->
  <path id="lossCurve"
        d="M 75 78 C 120 85, 150 160, 210 175 C 270 190, 340 198, 410 205 C 445 208, 465 208, 485 209"
        fill="none"
        stroke="url(#line-grad-ml)"
        stroke-width="3.5"
        stroke-linecap="round"
        class="curve-path"
        filter="url(#glow-cyan-ml)" />

  <!-- Shaded Area Under Curve -->
  <path d="M 75 78 C 120 85, 150 160, 210 175 C 270 190, 340 198, 410 205 C 445 208, 465 208, 485 209 L 485 230 L 75 230 Z"
        fill="url(#area-grad-ml)"
        class="area-fill" />

  <!-- Nodes along the curve -->
  <g fill="#00f0ff" opacity="0.9">
    <circle cx="75" cy="78" r="4" />
    <circle cx="150" cy="140" r="3.5" />
    <circle cx="240" cy="180" r="3.5" />
    <circle cx="340" cy="198" r="3.5" />
    <circle cx="430" cy="206" r="3.5" />
    <circle cx="485" cy="209" r="4.5" fill="#10b981" />
  </g>

  <!-- Travelling Beacon -->
  <g filter="url(#glow-strong-ml)">
    <circle r="6" fill="#00f0ff">
      <animateMotion dur="4s" repeatCount="indefinite" path="M 75 78 C 120 85, 150 160, 210 175 C 270 190, 340 198, 410 205 C 445 208, 465 208, 485 209" />
      <animate attributeName="opacity" values="0;1;1;1;0" dur="4s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#a855f7;#00f0ff;#00f0ff;#10b981;#10b981" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle r="12" fill="none" stroke="#00f0ff" stroke-width="1.5">
      <animateMotion dur="4s" repeatCount="indefinite" path="M 75 78 C 120 85, 150 160, 210 175 C 270 190, 340 198, 410 205 C 445 208, 465 208, 485 209" />
      <animate attributeName="r" values="8;15;8" dur="1s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.7;0.7;0.7;0" dur="4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Bottom Conceptual Workflow -->
  <g transform="translate(70, 268)">
    <text x="0" y="0" font-family="monospace" font-size="9" fill="#00f0ff" opacity="0.8">DATA_INPUT ──►</text>
    <text x="100" y="0" font-family="monospace" font-size="9" fill="#a855f7" opacity="0.8">BATCH_PROPAGATION ──►</text>
    <text x="255" y="0" font-family="monospace" font-size="9" fill="#00f0ff" opacity="0.8">GRADIENT_STEP ──►</text>
    <text x="375" y="0" font-family="monospace" font-size="9" fill="#10b981" opacity="0.9">STABLE_STATE ✓</text>
  </g>
</svg>