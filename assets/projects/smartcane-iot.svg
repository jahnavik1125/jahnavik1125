<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-p3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140c06" />
      <stop offset="100%" stop-color="#1c120a" />
    </linearGradient>
  </defs>
  <rect width="320" height="160" rx="8" fill="url(#bg-p3)" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4" />

  <text x="14" y="22" font-family="monospace" font-size="9" fill="#fbbf24" font-weight="700">ASSISTIVE IOT // ULTRASONIC RADAR</text>
  <text x="250" y="22" font-family="monospace" font-size="8" fill="#10b981">TRANSMIT</text>

  <!-- Ultrasonic Sensor Origin -->
  <g transform="translate(45, 85)">
    <rect x="-15" y="-20" width="30" height="40" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="-5" cy="-8" r="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
    <circle cx="-5" cy="8" r="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
    <text x="0" y="32" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">HC-SR04</text>
  </g>

  <!-- Expanding Sonar Waves -->
  <g stroke="#f59e0b" fill="none" opacity="0.75">
    <path d="M 80 55 A 40 40 0 0 1 80 115" stroke-width="1.5">
      <animate attributeName="opacity" values="0.1;0.9;0.1" dur="2s" repeatCount="indefinite" />
    </path>
    <path d="M 120 40 A 65 65 0 0 1 120 130" stroke-width="2">
      <animate attributeName="opacity" values="0.1;0.9;0.1" dur="2s" begin="0.4s" repeatCount="indefinite" />
    </path>
    <path d="M 160 25 A 90 90 0 0 1 160 145" stroke-width="2.5">
      <animate attributeName="opacity" values="0.1;0.9;0.1" dur="2s" begin="0.8s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Detected Obstacle -->
  <g transform="translate(230, 85)">
    <rect x="-8" y="-30" width="16" height="60" rx="3" fill="#ef4444" opacity="0.8" />
    <text x="0" y="-38" font-family="monospace" font-size="8" fill="#ef4444" text-anchor="middle">OBSTACLE</text>
    <text x="0" y="44" font-family="monospace" font-size="8" fill="#fbbf24" text-anchor="middle">HAPTIC ALERT</text>
  </g>

  <text x="14" y="150" font-family="monospace" font-size="8" fill="#64748b">ARDUINO EMBEDDED SYSTEM • HC-SR04 TELEMETRY • HAPTIC BUZZER</text>
</svg>