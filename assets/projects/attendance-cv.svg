<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-p2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#121a2e" />
    </linearGradient>
  </defs>
  <rect width="320" height="160" rx="8" fill="url(#bg-p2)" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
  
  <text x="14" y="22" font-family="monospace" font-size="9" fill="#10b981" font-weight="700">BIOMETRIC VISION // ATTENDANCE</text>
  <text x="260" y="22" font-family="monospace" font-size="8" fill="#00f0ff">ACTIVE</text>

  <!-- Vision Detection Bounding Box -->
  <g transform="translate(100, 35)">
    <rect width="120" height="90" rx="4" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6,4" />
    
    <!-- Corner Reticles -->
    <path d="M 0 14 L 0 0 L 14 0" stroke="#10b981" stroke-width="2.5" fill="none" />
    <path d="M 120 14 L 120 0 L 106 0" stroke="#10b981" stroke-width="2.5" fill="none" />
    <path d="M 0 76 L 0 90 L 14 90" stroke="#10b981" stroke-width="2.5" fill="none" />
    <path d="M 120 76 L 120 90 L 106 90" stroke="#10b981" stroke-width="2.5" fill="none" />

    <!-- Landmark Points on Face Mesh -->
    <g fill="#00f0ff">
      <circle cx="42" cy="35" r="3" />
      <circle cx="78" cy="35" r="3" />
      <circle cx="60" cy="50" r="2.5" />
      <circle cx="48" cy="65" r="2.5" />
      <circle cx="60" cy="68" r="2.5" />
      <circle cx="72" cy="65" r="2.5" />
    </g>

    <!-- Mesh Lines -->
    <path d="M 42 35 L 60 50 L 78 35 M 48 65 L 60 50 L 72 65 M 42 35 L 78 35 M 48 65 L 60 68 L 72 65"
          stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.6" fill="none" />

    <!-- Laser Scan Bar sweeping up and down -->
    <line x1="2" y1="10" x2="118" y2="10" stroke="#10b981" stroke-width="2" opacity="0.8">
      <animate attributeName="y1" values="5;85;5" dur="3s" repeatCount="indefinite" />
      <animate attributeName="y2" values="5;85;5" dur="3s" repeatCount="indefinite" />
    </line>
  </g>

  <text x="14" y="150" font-family="monospace" font-size="8" fill="#64748b">OPENCV REAL-TIME DETECTION • TIMETABLE GENERATION</text>
</svg>