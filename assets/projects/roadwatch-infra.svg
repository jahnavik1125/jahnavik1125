<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-p5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#12182c" />
    </linearGradient>
    <filter id="glow-p5" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="320" height="160" rx="8" fill="url(#bg-p5)" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4" />

  <text x="14" y="22" font-family="monospace" font-size="9" fill="#00f0ff" font-weight="700">INFRASTRUCTURE INTELLIGENCE // ROADWATCH</text>
  <text x="250" y="22" font-family="monospace" font-size="8" fill="#10b981">REALTIME</text>

  <!-- Road Network Map Grid -->
  <g stroke="#1e293b" stroke-width="0.8" opacity="0.6">
    <line x1="30" y1="50" x2="290" y2="50" />
    <line x1="30" y1="90" x2="290" y2="90" />
    <line x1="30" y1="130" x2="290" y2="130" />
    <line x1="90" y1="35" x2="90" y2="145" />
    <line x1="160" y1="35" x2="160" y2="145" />
    <line x1="230" y1="35" x2="230" y2="145" />
  </g>

  <!-- Interactive Road Arteries -->
  <path d="M 40 125 L 110 90 L 190 110 L 270 55" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.8" />
  <path d="M 110 90 L 160 45 L 240 70" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7">
    <animate attributeName="stroke-dashoffset" from="32" to="0" dur="2s" repeatCount="indefinite" />
  </path>

  <!-- Live Pulse Beacon along road artery -->
  <circle r="4" fill="#00f0ff" filter="url(#glow-p5)">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M 40 125 L 110 90 L 190 110 L 270 55" />
  </circle>

  <!-- Project Infrastructure Nodes -->
  <g fill="#00f0ff">
    <circle cx="40" cy="125" r="4.5" />
    <circle cx="110" cy="90" r="5" fill="#10b981" />
    <circle cx="160" cy="45" r="4.5" fill="#a855f7" />
    <circle cx="190" cy="110" r="4" />
    <circle cx="270" cy="55" r="5.5" fill="#10b981" />
  </g>

  <!-- Node Pulsing Radii -->
  <circle cx="110" cy="90" r="10" fill="none" stroke="#10b981" stroke-width="1" opacity="0.6">
    <animate attributeName="r" values="6;14;6" dur="1.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0.1;0.8" dur="1.5s" repeatCount="indefinite" />
  </circle>

  <text x="14" y="150" font-family="monospace" font-size="8" fill="#64748b">GEOSPATIAL MONITORING • NODE.JS • SQLITE • SOCKET.IO</text>
</svg>