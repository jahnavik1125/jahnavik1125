<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-p1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060e1e" />
      <stop offset="100%" stop-color="#0a192f" />
    </linearGradient>
  </defs>
  <rect width="320" height="160" rx="8" fill="url(#bg-p1)" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4" />
  
  <!-- Ocean Grid Lines -->
  <g stroke="#1e3a5f" stroke-width="0.8" stroke-dasharray="2,4" opacity="0.6">
    <line x1="20" y1="40" x2="300" y2="40" />
    <line x1="20" y1="80" x2="300" y2="80" />
    <line x1="20" y1="120" x2="300" y2="120" />
    <line x1="80" y1="20" x2="80" y2="140" />
    <line x1="160" y1="20" x2="160" y2="140" />
    <line x1="240" y1="20" x2="240" y2="140" />
  </g>

  <!-- Title / Telemetry Tag -->
  <text x="14" y="22" font-family="monospace" font-size="9" fill="#00f0ff" font-weight="700">MARITIME LOGISTICS // ROUTE RISK</text>
  <text x="250" y="22" font-family="monospace" font-size="8" fill="#10b981">OPTIMIZED</text>

  <!-- Dynamic Waypoint Route -->
  <path d="M 40 120 Q 110 50, 180 80 T 280 45" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-dasharray="4, 4">
    <animate attributeName="stroke-dashoffset" from="32" to="0" dur="2s" repeatCount="indefinite" />
  </path>

  <!-- Moving Vessel / Telemetry Marker -->
  <circle r="5" fill="#00f0ff">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 40 120 Q 110 50, 180 80 T 280 45" />
  </circle>
  <circle r="10" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.7">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 40 120 Q 110 50, 180 80 T 280 45" />
    <animate attributeName="r" values="6;14;6" dur="1s" repeatCount="indefinite" />
  </circle>

  <!-- Waypoint Ports -->
  <circle cx="40" cy="120" r="4" fill="#a855f7" />
  <text x="40" y="138" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">ORIGIN</text>

  <circle cx="180" cy="80" r="4" fill="#a855f7" />
  <text x="180" y="98" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">ALT PORT</text>

  <circle cx="280" cy="45" r="4" fill="#10b981" />
  <text x="280" y="35" font-family="monospace" font-size="8" fill="#10b981" text-anchor="middle">DESTINATION</text>

  <text x="14" y="150" font-family="monospace" font-size="8" fill="#64748b">SEASONAL FORECAST • RISK PREDICTION MATRIX</text>
</svg>