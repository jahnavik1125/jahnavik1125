<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-nn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a16" />
      <stop offset="100%" stop-color="#0c1024" />
    </linearGradient>
    <filter id="glow-node" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .panel-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; font-size: 11px; font-weight: 700; fill: #a855f7; letter-spacing: 1.5px; }
    .panel-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; font-size: 10px; fill: #94a3b8; letter-spacing: 1px; }
    .layer-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; font-size: 9px; font-weight: 600; fill: #64748b; letter-spacing: 1px; }

    /* Synaptic connection line pulse */
    .synapse {
      stroke: #334155;
      stroke-width: 0.8;
      opacity: 0.35;
    }

    /* Signal packet along synapse */
    .signal-pulse {
      stroke-dasharray: 4, 30;
      animation: signalFlow 2.5s linear infinite;
    }
    @keyframes signalFlow {
      from { stroke-dashoffset: 68; }
      to { stroke-dashoffset: 0; }
    }

    .node-pulse {
      animation: nodeBreathe 2s ease-in-out infinite alternate;
    }
    @keyframes nodeBreathe {
      from { r: 6; opacity: 0.7; }
      to { r: 8.5; opacity: 1; }
    }
  </style>

  <!-- Background -->
  <rect width="540" height="280" rx="14" fill="url(#bg-grad-nn)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.3" />

  <!-- Corner Brackets -->
  <g stroke="#a855f7" stroke-width="1.8" fill="none" opacity="0.75">
    <path d="M 12 24 L 12 12 L 24 12" />
    <path d="M 528 24 L 528 12 L 516 12" />
    <path d="M 12 256 L 12 268 L 24 268" />
    <path d="M 528 256 L 528 268 L 516 268" />
  </g>

  <!-- Header -->
  <g transform="translate(24, 22)">
    <circle cx="0" cy="5" r="3.5" fill="#ef4444" opacity="0.8" />
    <circle cx="10" cy="5" r="3.5" fill="#f59e0b" opacity="0.8" />
    <circle cx="20" cy="5" r="3.5" fill="#10b981" opacity="0.8" />

    <text x="32" y="9" class="panel-title">NEURAL COMPUTATION</text>
    <text x="195" y="9" class="panel-sub">// MODEL FLOW</text>

    <rect x="360" y="-3" width="130" height="18" rx="9" fill="#140c24" stroke="#a855f7" stroke-width="0.8" stroke-opacity="0.6" />
    <circle cx="372" cy="6" r="3.5" fill="#a855f7">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="382" y="9" font-family="monospace" font-size="9" fill="#a855f7" font-weight="600">FORWARD PASS</text>
  </g>

  <!-- Layer Labels -->
  <text x="80" y="55" class="layer-title" text-anchor="middle">INPUT LAYER</text>
  <text x="200" y="55" class="layer-title" text-anchor="middle">HIDDEN LAYER 1</text>
  <text x="340" y="55" class="layer-title" text-anchor="middle">HIDDEN LAYER 2</text>
  <text x="460" y="55" class="layer-title" text-anchor="middle">PREDICTION</text>

  <!-- Synapse Lines (Dense Connections) -->
  <!-- Layer 0 (Input, x=80, 4 nodes: y=80, 120, 160, 200) -->
  <!-- Layer 1 (Hidden 1, x=200, 5 nodes: y=70, 105, 140, 175, 210) -->
  <!-- Layer 2 (Hidden 2, x=340, 5 nodes: y=70, 105, 140, 175, 210) -->
  <!-- Layer 3 (Output, x=460, 3 nodes: y=95, 140, 185) -->

  <g class="synapse">
    <!-- L0 to L1 -->
    <path d="
      M 80 80 L 200 70 M 80 80 L 200 105 M 80 80 L 200 140 M 80 80 L 200 175 M 80 80 L 200 210
      M 80 120 L 200 70 M 80 120 L 200 105 M 80 120 L 200 140 M 80 120 L 200 175 M 80 120 L 200 210
      M 80 160 L 200 70 M 80 160 L 200 105 M 80 160 L 200 140 M 80 160 L 200 175 M 80 160 L 200 210
      M 80 200 L 200 70 M 80 200 L 200 105 M 80 200 L 200 140 M 80 200 L 200 175 M 80 200 L 200 210
    " />
    <!-- L1 to L2 -->
    <path d="
      M 200 70 L 340 70 M 200 70 L 340 105 M 200 70 L 340 140 M 200 70 L 340 175 M 200 70 L 340 210
      M 200 105 L 340 70 M 200 105 L 340 105 M 200 105 L 340 140 M 200 105 L 340 175 M 200 105 L 340 210
      M 200 140 L 340 70 M 200 140 L 340 105 M 200 140 L 340 140 M 200 140 L 340 175 M 200 140 L 340 210
      M 200 175 L 340 70 M 200 175 L 340 105 M 200 175 L 340 140 M 200 175 L 340 175 M 200 175 L 340 210
      M 200 210 L 340 70 M 200 210 L 340 105 M 200 210 L 340 140 M 200 210 L 340 175 M 200 210 L 340 210
    " />
    <!-- L2 to L3 -->
    <path d="
      M 340 70 L 460 95 M 340 70 L 460 140 M 340 70 L 460 185
      M 340 105 L 460 95 M 340 105 L 460 140 M 340 105 L 460 185
      M 340 140 L 460 95 M 340 140 L 460 140 M 340 140 L 460 185
      M 340 175 L 460 95 M 340 175 L 460 140 M 340 175 L 460 185
      M 340 210 L 460 95 M 340 210 L 460 140 M 340 210 L 460 185
    " />
  </g>

  <!-- Active Signal Pulses Traveling Through Network -->
  <g stroke="#00f0ff" stroke-width="1.8" fill="none" opacity="0.85">
    <!-- L0 -> L1 Active Pulses -->
    <line x1="80" y1="80" x2="200" y2="105" stroke-dasharray="8, 50" class="signal-pulse" />
    <line x1="80" y1="120" x2="200" y2="70" stroke-dasharray="10, 60" class="signal-pulse" />
    <line x1="80" y1="160" x2="200" y2="140" stroke-dasharray="12, 50" class="signal-pulse" />
    <line x1="80" y1="200" x2="200" y2="175" stroke-dasharray="8, 60" class="signal-pulse" />
    
    <!-- L1 -> L2 Active Pulses -->
    <line x1="200" y1="70" x2="340" y2="140" stroke="#a855f7" stroke-dasharray="10, 60" class="signal-pulse" />
    <line x1="200" y1="105" x2="340" y2="105" stroke="#00f0ff" stroke-dasharray="8, 55" class="signal-pulse" />
    <line x1="200" y1="140" x2="340" y2="70" stroke="#a855f7" stroke-dasharray="12, 65" class="signal-pulse" />
    <line x1="200" y1="175" x2="340" y2="210" stroke="#00f0ff" stroke-dasharray="8, 50" class="signal-pulse" />

    <!-- L2 -> L3 Active Pulses -->
    <line x1="340" y1="105" x2="460" y2="140" stroke="#10b981" stroke-dasharray="12, 55" class="signal-pulse" />
    <line x1="340" y1="140" x2="460" y2="140" stroke="#00f0ff" stroke-dasharray="10, 50" class="signal-pulse" />
    <line x1="340" y1="175" x2="460" y2="95" stroke="#10b981" stroke-dasharray="8, 60" class="signal-pulse" />
  </g>

  <!-- Layer 0 Nodes (Input - Cyan) -->
  <g fill="#00f0ff" filter="url(#glow-node)">
    <circle cx="80" cy="80" r="7" />
    <circle cx="80" cy="120" r="7" />
    <circle cx="80" cy="160" r="7" />
    <circle cx="80" cy="200" r="7" />
  </g>

  <!-- Layer 1 Nodes (Hidden 1 - Violet/Cyan) -->
  <g fill="#a855f7" filter="url(#glow-node)">
    <circle cx="200" cy="70" r="7.5" />
    <circle cx="200" cy="105" r="7.5" fill="#00f0ff" />
    <circle cx="200" cy="140" r="7.5" />
    <circle cx="200" cy="175" r="7.5" fill="#00f0ff" />
    <circle cx="200" cy="210" r="7.5" />
  </g>

  <!-- Layer 2 Nodes (Hidden 2 - Violet/Cyan) -->
  <g fill="#00f0ff" filter="url(#glow-node)">
    <circle cx="340" cy="70" r="7.5" fill="#a855f7" />
    <circle cx="340" cy="105" r="7.5" />
    <circle cx="340" cy="140" r="8" class="node-pulse" fill="#10b981" />
    <circle cx="340" cy="175" r="7.5" />
    <circle cx="340" cy="210" r="7.5" fill="#a855f7" />
  </g>

  <!-- Layer 3 Nodes (Output - Emerald Target) -->
  <g fill="#10b981" filter="url(#glow-node)">
    <circle cx="460" cy="95" r="7.5" fill="#64748b" />
    <circle cx="460" cy="140" r="9" class="node-pulse" fill="#10b981" />
    <circle cx="460" cy="185" r="7.5" fill="#64748b" />
  </g>

  <!-- Output Target Ring -->
  <circle cx="460" cy="140" r="15" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3">
    <animateTransform attributeName="transform" type="rotate" from="0 460 140" to="360 460 140" dur="4s" repeatCount="indefinite" />
  </circle>

  <!-- Bottom Conceptual Pipeline -->
  <g transform="translate(60, 268)">
    <text x="0" y="0" font-family="monospace" font-size="9" fill="#00f0ff" opacity="0.85">DATA_TENSOR ──►</text>
    <text x="110" y="0" font-family="monospace" font-size="9" fill="#a855f7" opacity="0.85">SYNAPTIC_WEIGHTS ──►</text>
    <text x="250" y="0" font-family="monospace" font-size="9" fill="#00f0ff" opacity="0.85">FEATURE_MAPPING ──►</text>
    <text x="385" y="0" font-family="monospace" font-size="9" fill="#10b981" opacity="0.95">PREDICTION_OUTPUT ✓</text>
  </g>
</svg>