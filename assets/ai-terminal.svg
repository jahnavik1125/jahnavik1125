<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-term" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060914" />
      <stop offset="100%" stop-color="#0b1022" />
    </linearGradient>
  </defs>

  <style>
    .t-header { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; font-size: 11px; fill: #64748b; font-weight: 600; letter-spacing: 1px; }
    .t-code { font-family: 'Consolas', 'Fira Code', monospace; font-size: 13px; fill: #cbd5e1; }
    .t-cyan { fill: #00f0ff; font-weight: 700; }
    .t-violet { fill: #c084fc; }
    .t-green { fill: #10b981; font-weight: 700; }
    .t-dim { fill: #64748b; }

    /* Typing line animations */
    .line1 { opacity: 0; animation: showLine 6s ease infinite; animation-delay: 0s; }
    .line2 { opacity: 0; animation: showLine 6s ease infinite; animation-delay: 0.8s; }
    .line3 { opacity: 0; animation: showLine 6s ease infinite; animation-delay: 1.6s; }
    .line4 { opacity: 0; animation: showLine 6s ease infinite; animation-delay: 2.4s; }

    @keyframes showLine {
      0% { opacity: 0; transform: translateY(2px); }
      10% { opacity: 1; transform: translateY(0); }
      85% { opacity: 1; }
      95% { opacity: 0; }
      100% { opacity: 0; }
    }

    .cursor {
      animation: blink 0.9s steps(2, start) infinite;
    }
    @keyframes blink {
      to { visibility: hidden; }
    }
  </style>

  <!-- Terminal Window Background -->
  <rect width="760" height="210" rx="12" fill="url(#bg-term)" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.35" />

  <!-- Top Title Bar -->
  <rect width="760" height="34" rx="12" fill="#0c1124" />
  <rect y="22" width="760" height="12" fill="#0c1124" />
  <line x1="0" y1="34" x2="760" y2="34" stroke="#1e293b" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="20" cy="17" r="5" fill="#ef4444" />
  <circle cx="36" cy="17" r="5" fill="#f59e0b" />
  <circle cx="52" cy="17" r="5" fill="#10b981" />

  <text x="380" y="21" class="t-header" text-anchor="middle">JAHNAVI_AI.exe — bash — 80x24</text>

  <!-- Live status on right of title bar -->
  <circle cx="715" cy="17" r="4" fill="#10b981">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" />
  </circle>
  <text x="660" y="21" class="t-header" fill="#10b981">ONLINE</text>

  <!-- Terminal Body Content -->
  <g transform="translate(24, 62)">
    <!-- Line 1 -->
    <g class="line1">
      <text x="0" y="0" class="t-code"><tspan class="t-dim">&gt; </tspan><tspan class="t-cyan">INITIALIZING PROFILE CORE</tspan> ... <tspan class="t-green">[OK]</tspan></text>
    </g>

    <!-- Line 2 -->
    <g class="line2">
      <text x="0" y="28" class="t-code"><tspan class="t-dim">&gt; </tspan><tspan class="t-violet">BMSCE // ARTIFICIAL INTELLIGENCE &amp; DATA SCIENCE</tspan> ... <tspan class="t-green">3RD YEAR ACTIVE</tspan></text>
    </g>

    <!-- Line 3 -->
    <g class="line3">
      <text x="0" y="56" class="t-code"><tspan class="t-dim">&gt; </tspan><tspan class="t-cyan">LOADING MODULES:</tspan> <tspan fill="#94a3b8">MACHINE LEARNING • COMPUTER VISION • DATA ANALYTICS</tspan></text>
    </g>

    <!-- Line 4 -->
    <g class="line4">
      <text x="0" y="84" class="t-code"><tspan class="t-dim">&gt; </tspan><tspan class="t-green">SYSTEM READY ✓</tspan> <tspan class="t-dim">// EXPLORING INTELLIGENCE THROUGH DATA &amp; MODELS</tspan> <tspan class="cursor" fill="#00f0ff">█</tspan></text>
    </g>

    <!-- Bottom Status Line -->
    <g transform="translate(0, 122)">
      <line x1="0" y1="0" x2="712" y2="0" stroke="#1e293b" stroke-width="1" />
      <text x="0" y="16" font-family="monospace" font-size="10" fill="#64748b">LOCATION: <tspan fill="#00f0ff">BENGALURU, INDIA</tspan></text>
      <text x="240" y="16" font-family="monospace" font-size="10" fill="#64748b">ENVIRONMENT: <tspan fill="#a855f7">AI &amp; DATA SCIENCE WORKSPACE</tspan></text>
      <text x="540" y="16" font-family="monospace" font-size="10" fill="#64748b">STATUS: <tspan fill="#10b981">CONSTANTLY LEARNING ●</tspan></text>
    </g>
  </g>
</svg>