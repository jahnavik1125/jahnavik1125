<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05050c" />
      <stop offset="50%" stop-color="#0a0b16" />
      <stop offset="100%" stop-color="#120e25" />
    </linearGradient>

    <!-- Cyan-Violet Accent Gradient -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-violet" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 800; font-size: 44px; fill: url(#primary-grad); letter-spacing: 5px; }
    .subtitle { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 600; font-size: 15px; fill: #00f0ff; letter-spacing: 2px; opacity: 0.9; }
    .tagline { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 400; font-size: 12px; fill: #8b9bb4; letter-spacing: 0.5px; }
  </style>

  <!-- Background -->
  <rect width="800" height="250" fill="url(#bg-grad)" rx="12" />

  <!-- Constellation/Network Connections (Background Layer) -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.12">
    <line x1="500" y1="50" x2="620" y2="30" />
    <line x1="620" y1="30" x2="700" y2="80" />
    <line x1="700" y1="80" x2="720" y2="180" />
    <line x1="720" y1="180" x2="640" y2="210" />
    <line x1="640" y1="210" x2="520" y2="170" />
    <line x1="520" y1="170" x2="500" y2="50" />
    
    <!-- Inner mesh -->
    <line x1="500" y1="50" x2="580" y2="120" />
    <line x1="620" y1="30" x2="580" y2="120" />
    <line x1="700" y1="80" x2="580" y2="120" />
    <line x1="700" y1="80" x2="660" y2="140" />
    <line x1="720" y1="180" x2="660" y2="140" />
    <line x1="640" y1="210" x2="660" y2="140" />
    <line x1="520" y1="170" x2="580" y2="120" />
    <line x1="520" y1="170" x2="660" y2="140" />
    <line x1="580" y1="120" x2="660" y2="140" />
  </g>

  <!-- Glowing edges (Accent Layer) -->
  <g stroke-width="1.2" opacity="0.6">
    <!-- Cyan paths -->
    <line x1="500" y1="50" x2="580" y2="120" stroke="#00f0ff" />
    <line x1="580" y1="120" x2="640" y2="210" stroke="#00f0ff" />
    <line x1="700" y1="80" x2="660" y2="140" stroke="#00f0ff" />
    
    <!-- Violet paths -->
    <line x1="620" y1="30" x2="580" y2="120" stroke="#a855f7" />
    <line x1="580" y1="120" x2="660" y2="140" stroke="#a855f7" />
    <line x1="660" y1="140" x2="720" y2="180" stroke="#a855f7" />
  </g>

  <!-- Glowing Nodes -->
  <!-- Cyan nodes (Frontend/Interactivity) -->
  <circle cx="500" cy="50" r="5" fill="#00f0ff" filter="url(#glow-cyan)" />
  <circle cx="640" cy="210" r="7" fill="#00f0ff" filter="url(#glow-cyan)" />
  <circle cx="700" cy="80" r="4" fill="#00f0ff" filter="url(#glow-cyan)" />
  <circle cx="580" cy="120" r="9" fill="#00f0ff" filter="url(#glow-cyan)" />

  <!-- Violet nodes (AI/DS/Data System) -->
  <circle cx="620" cy="30" r="6" fill="#a855f7" filter="url(#glow-violet)" />
  <circle cx="720" cy="180" r="8" fill="#a855f7" filter="url(#glow-violet)" />
  <circle cx="660" cy="140" r="10" fill="#a855f7" filter="url(#glow-violet)" />
  <circle cx="520" cy="170" r="5" fill="#a855f7" filter="url(#glow-violet)" />

  <!-- Background decorative small stars -->
  <circle cx="430" cy="60" r="1" fill="#ffffff" opacity="0.3" />
  <circle cx="450" cy="170" r="1" fill="#ffffff" opacity="0.4" />
  <circle cx="760" cy="50" r="1.5" fill="#ffffff" opacity="0.6" />
  <circle cx="770" cy="120" r="1" fill="#ffffff" opacity="0.2" />
  <circle cx="530" cy="220" r="1" fill="#ffffff" opacity="0.5" />

  <!-- Branding Text on the Left -->
  <text x="50" y="105" class="title">JAHNAVI</text>
  <text x="50" y="138" class="subtitle">AI &amp; INTERACTIVE SYSTEMS ENGINEER</text>
  <text x="50" y="168" class="tagline">Bridging cognitive AI engines with responsive visual universes.</text>
</svg>
