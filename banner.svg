<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-ban" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050714" />
      <stop offset="50%" stop-color="#090d20" />
      <stop offset="100%" stop-color="#120c29" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="glow-banner" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .b-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; font-size: 42px; fill: url(#text-grad); letter-spacing: 4px; }
    .b-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 15px; fill: #00f0ff; letter-spacing: 2px; }
    .b-inst { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 13px; fill: #cbd5e1; letter-spacing: 1px; }
    .b-tagline { font-family: 'Consolas', 'Fira Code', monospace; font-size: 12px; fill: #94a3b8; letter-spacing: 0.5px; }
    
    .hud-line { stroke: #1e293b; stroke-width: 1; }
    .scan-h {
      animation: scanH 4s linear infinite;
    }
    @keyframes scanH {
      0% { transform: translateY(0); opacity: 0; }
      15% { opacity: 0.8; }
      85% { opacity: 0.8; }
      100% { transform: translateY(220px); opacity: 0; }
    }
  </style>

  <!-- Background -->
  <rect width="960" height="220" rx="14" fill="url(#bg-ban)" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.35" />

  <!-- Technical Grid Pattern -->
  <g stroke="#162238" stroke-width="0.8" opacity="0.5">
    <line x1="0" y1="55" x2="960" y2="55" />
    <line x1="0" y1="110" x2="960" y2="110" />
    <line x1="0" y1="165" x2="960" y2="165" />
    <line x1="240" y1="0" x2="240" y2="220" />
    <line x1="480" y1="0" x2="480" y2="220" />
    <line x1="720" y1="0" x2="720" y2="220" />
  </g>

  <!-- HUD Corner Brackets -->
  <g stroke="#00f0ff" stroke-width="2" fill="none" opacity="0.8">
    <path d="M 12 24 L 12 12 L 24 12" />
    <path d="M 948 24 L 948 12 L 936 12" />
    <path d="M 12 196 L 12 208 L 24 208" />
    <path d="M 948 196 L 948 208 L 936 208" />
  </g>

  <!-- Right Side Constellation / HUD Graphic -->
  <g transform="translate(680, 20)">
    <!-- Rotating HUD Reticle -->
    <circle cx="140" cy="90" r="70" fill="none" stroke="#1e293b" stroke-width="1" />
    <circle cx="140" cy="90" r="55" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="6, 8" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0 140 90" to="360 140 90" dur="12s" repeatCount="indefinite" />
    </circle>
    <circle cx="140" cy="90" r="40" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="12, 16" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="360 140 90" to="0 140 90" dur="9s" repeatCount="indefinite" />
    </circle>
    <circle cx="140" cy="90" r="6" fill="#00f0ff" filter="url(#glow-banner)" />
    
    <!-- Coordinate Nodes -->
    <circle cx="85" cy="55" r="3.5" fill="#a855f7" />
    <circle cx="195" cy="65" r="3.5" fill="#00f0ff" />
    <circle cx="170" cy="135" r="3.5" fill="#10b981" />
    <circle cx="95" cy="125" r="3.5" fill="#00f0ff" />

    <line x1="85" y1="55" x2="140" y2="90" stroke="#a855f7" stroke-width="0.8" opacity="0.5" />
    <line x1="195" y1="65" x2="140" y2="90" stroke="#00f0ff" stroke-width="0.8" opacity="0.5" />
    <line x1="170" y1="135" x2="140" y2="90" stroke="#10b981" stroke-width="0.8" opacity="0.5" />
    <line x1="95" y1="125" x2="140" y2="90" stroke="#00f0ff" stroke-width="0.8" opacity="0.5" />
  </g>

  <!-- Left Content Branding -->
  <g transform="translate(48, 48)">
    <text x="0" y="0" font-family="monospace" font-size="11" fill="#00f0ff" letter-spacing="2px">PROFILE.SYSTEM // ONLINE</text>
    <text x="0" y="44" class="b-name">KANDULA JAHNAVI</text>
    <text x="0" y="74" class="b-sub">ARTIFICIAL INTELLIGENCE &amp; DATA SCIENCE</text>
    <text x="0" y="98" class="b-inst">BMS College of Engineering  •  Bengaluru, India</text>
    <text x="0" y="124" class="b-tagline">&gt; Exploring intelligence through data, models &amp; practical technology</text>
  </g>
</svg>